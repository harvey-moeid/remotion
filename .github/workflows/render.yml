name: render

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: ID job (UUID) dari Worker
        required: true
        type: string
      template:
        description: ID komposisi Remotion
        required: true
        type: string
      props:
        description: Props komposisi dalam JSON
        required: false
        default: '{}'
        type: string
      ratio:
        description: Rasio video (9:16 atau 16:9)
        required: false
        default: '9:16'
        type: string

permissions:
  contents: read

env:
  API_URL: https://remotion-api.harveymoeid.workers.dev
  JOB_ID: ${{ inputs.jobId }}
  TEMPLATE: ${{ inputs.template }}
  RATIO: ${{ inputs.ratio }}
  PROPS_JSON: ${{ inputs.props }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# UPLOAD_TOKEN sengaja HANYA diberikan ke langkah yang memerlukannya (bukan ke seluruh job),
# supaya kode kustom yang dijalankan saat render tidak bisa membaca token tersebut.
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validasi input
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo '::error::jobId tidak valid'; exit 1; }
          [[ "$TEMPLATE" =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo '::error::template tidak valid'; exit 1; }
          [ -n "$UPLOAD_TOKEN" ] || { echo '::error::secret UPLOAD_TOKEN belum diisi'; exit 1; }

      # Worker membalas HTTP 409 bila job sudah dibatalkan pengguna saat masih antre;
      # run langsung dihentikan agar tidak membuang menit GitHub Actions.
      - name: Lapor status rendering
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API_URL/api/jobs/$JOB_ID/status" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"status":"rendering","runUrl":"'"$RUN_URL"'"}' || echo 000)
          if [ "$code" = "409" ]; then
            echo '::notice::Job dibatalkan pengguna, run dihentikan'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang library sistem untuk Chrome headless
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 fonts-liberation fonts-noto-color-emoji

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Siapkan props
        run: node scripts/prepare-props.mjs

      - name: Ambil kode kustom dari Worker
        if: inputs.template == 'CustomCode'
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 3 "$API_URL/api/jobs/$JOB_ID/code" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -o src/custom/UserCode.tsx
          test -s src/custom/UserCode.tsx || { echo '::error::kode kustom kosong'; exit 1; }
          echo "Kode kustom: $(wc -c < src/custom/UserCode.tsx) byte"

      # Thumbnail = satu frame diam (detik ke-1, cadangan frame 0 untuk komposisi sangat pendek).
      # Tidak fatal: bila gagal, render video tetap lanjut dan riwayat memakai placeholder.
      # Langkah ini TIDAK menerima UPLOAD_TOKEN (sama seperti render video).
      - name: Render thumbnail
        id: thumb
        continue-on-error: true
        run: |
          mkdir -p out
          npx remotion still src/index.ts "$TEMPLATE" out/thumb.jpg --props=props.json --frame=30 --scale=0.4 --image-format=jpeg --log=error \
            || npx remotion still src/index.ts "$TEMPLATE" out/thumb.jpg --props=props.json --frame=0 --scale=0.4 --image-format=jpeg --log=error
          ls -lh out/thumb.jpg

      # Diunggah SEBELUM video supaya thumbnail sudah ada ketika status berubah menjadi done.
      - name: Unggah thumbnail ke Worker (R2)
        if: steps.thumb.outcome == 'success'
        continue-on-error: true
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl -fsS --retry 2 --retry-delay 3 --retry-all-errors -X PUT "$API_URL/upload-thumb?jobId=$JOB_ID" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H 'Content-Type: image/jpeg' \
            --data-binary @out/thumb.jpg

      - name: Render video
        run: npx remotion render src/index.ts "$TEMPLATE" out/video.mp4 --props=props.json --codec=h264 --log=info

      - name: Unggah MP4 ke Worker (R2)
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          ls -lh out/video.mp4
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -X PUT "$API_URL/upload?jobId=$JOB_ID" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H 'Content-Type: video/mp4' \
            --data-binary @out/video.mp4

      - name: Lapor gagal
        if: failure()
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl -sS -X POST "$API_URL/api/jobs/$JOB_ID/status" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"status":"failed","message":"Render gagal, lihat log GitHub Actions","runUrl":"'"$RUN_URL"'"}' || true

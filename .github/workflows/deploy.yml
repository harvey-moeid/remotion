name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_URL: https://remotion-api.harveymoeid.workers.dev

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID UPLOAD_TOKEN DISPATCH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          if [ -z "$ACCESS_CODE" ]; then echo '::warning::Secret ACCESS_CODE belum diisi: template Kode kustom dinonaktifkan'; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi Worker
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Set secret Worker
        working-directory: worker
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          printf '%s' "$UPLOAD_TOKEN" | npx wrangler secret put UPLOAD_TOKEN
          printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put DISPATCH_TOKEN
          if [ -n "$ACCESS_CODE" ]; then printf '%s' "$ACCESS_CODE" | npx wrangler secret put ACCESS_CODE; fi

      - name: Smoke test asset endpoints (must reject without access code)
        run: |
          post_code=$(curl -sS -o /tmp/asset-post.json -w '%{http_code}' -X POST "$API_URL/api/assets")
          get_code=$(curl -sS -o /tmp/asset-get.json -w '%{http_code}' "$API_URL/api/assets")
          delete_code=$(curl -sS -o /tmp/asset-delete.json -w '%{http_code}' -X DELETE "$API_URL/api/assets/2026-11-15/00000000-0000-4000-8000-000000000000.png")
          render_code=$(curl -sS -o /tmp/asset-render.json -w '%{http_code}' -X POST "$API_URL/api/render" -H 'Content-Type: application/json' -d '{"template":"KineticTitle","ratio":"9:16","props":{},"assets":["assets/2026-11-15/00000000-0000-4000-8000-000000000000.png"],"accessCode":"invalid-test-code"}')
          [ "$post_code" = "401" ] || { cat /tmp/asset-post.json; echo "::error::POST /api/assets should reject without code (got $post_code)"; exit 1; }
          [ "$get_code" = "401" ] || { cat /tmp/asset-get.json; echo "::error::GET /api/assets should reject without code (got $get_code)"; exit 1; }
          [ "$delete_code" = "401" ] || { cat /tmp/asset-delete.json; echo "::error::DELETE /api/assets should reject without code (got $delete_code)"; exit 1; }
          [ "$render_code" = "401" ] || { cat /tmp/asset-render.json; echo "::error::Render with invalid asset code should reject (got $render_code)"; exit 1; }
          echo 'Asset upload/list/delete/render endpoints reject unauthenticated requests as expected.'

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buat project Pages (abaikan jika sudah ada)
        run: npx --yes wrangler@4 pages project create remotion-studio --production-branch main || true

      - name: Stamp versi service worker (PWA)
        run: |
          build="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_ID__/${build}/" web/sw.js
          grep -q "const BUILD = '${build}';" web/sw.js || { echo "::error::Gagal menyisipkan BUILD ke web/sw.js"; exit 1; }

      - name: Deploy Pages
        run: npx --yes wrangler@4 pages deploy web --project-name remotion-studio --branch main --commit-dirty=true

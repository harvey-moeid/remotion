name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
  DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID UPLOAD_TOKEN DISPATCH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi Worker
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Set secret Worker
        working-directory: worker
        run: |
          printf '%s' "$UPLOAD_TOKEN" | npx wrangler secret put UPLOAD_TOKEN
          printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put DISPATCH_TOKEN

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buat project Pages (abaikan jika sudah ada)
        run: npx --yes wrangler@4 pages project create remotion-studio --production-branch main || true

      - name: Deploy Pages
        run: npx --yes wrangler@4 pages deploy web --project-name remotion-studio --branch main --commit-dirty=true

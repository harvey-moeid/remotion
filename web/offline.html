<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="robots" content="noindex">
  <title>Offline — Byga Remotion Studio</title>
  <style>
    :root { color-scheme: dark; --bg: #090d16; --text: #edf3fc; --muted: #8c9bb2; --accent: #b6f36a; --line: rgba(153, 177, 211, .24); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--text); font-family: "DM Sans", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; text-align: center; }
    main { max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid var(--line); image-rendering: pixelated; }
    h1 { margin: 22px 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -.6px; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    button { min-height: 46px; padding: 10px 22px; border: 0; border-radius: 10px; color: #0b1608; background: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" width="96" height="96" alt="Logo Byga">
    <h1>Anda sedang offline</h1>
    <p>Halaman ini belum tersimpan di perangkat. Sambungkan kembali ke internet, lalu coba lagi. Render video selalu membutuhkan koneksi.</p>
    <button type="button" id="retry">Coba lagi</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
